# YOLO Training Configuration for Medical Waste Detection

# Dataset configuration
data_yaml: './waste_detection_dataset/dataset.yaml'

# Model configuration
model_size: 'm'  # nano(n), small(s), medium(m), large(l), xlarge(x)

# Training parameters
epochs: 100
imgsz: 640
batch_size: 16
patience: 50
save_period: 10
seed: 42

# Experiment naming
experiment_name: 'waste_detection_v1'
output_dir: './runs/detect'
models_dir: './models'

# Data augmentation
close_mosaic: 10
augment: true

# Optimizer settings
optimizer: 'SGD'
lr0: 0.01        # initial learning rate
lrf: 0.01        # final learning rate
momentum: 0.937
weight_decay: 0.0005

# Warmup
warmup_epochs: 3.0
warmup_momentum: 0.8

# Loss weights
box: 7.5
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou: 0.7
fl_gamma: 0.0  # Focal loss gamma

# Early stopping
early_stop_patience: 50
